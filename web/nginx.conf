# nginx configuration of the web image (web/Dockerfile).
#
# This file is an nginx *template*: the image copies it to /etc/nginx/templates/default.conf.template
# and the official entrypoint renders it with envsubst into /etc/nginx/conf.d/default.conf on start.
# Only variables that exist in the environment are substituted (nginx's own $variables are kept):
#
#   BACKEND_UPSTREAM      host:port of the backend API              (image default: backend:3000)
#   NGINX_RESOLVER        DNS resolver for BACKEND_UPSTREAM          (image default: 127.0.0.11, Docker's DNS)
#   CLIENT_MAX_BODY_SIZE  request body limit (evidence uploads)      (image default: 520m ≥ EVIDENCE_MAX_BYTES)
#
# The SPA_SCRIPT_HASHES placeholder in script-src is replaced at image build time by the CSP hashes of the inline scripts in
# index.html (computed from the built file, so editing index.html cannot silently break the CSP).
#
# TLS is terminated in front of this container (see docs/DEPLOYMENT.md); HSTS is set there and,
# for API responses, by the backend (helmet, when COOKIE_SECURE=true).

# The API path prefix gets no SPA headers: the backend sets its own (strict CSP, nosniff, no-store,
# evidence download headers) and duplicates would only confuse clients.
map $uri $stn_is_api {
    ~^/api/  1;
    default  0;
}
map $stn_is_api $stn_csp {
    1        "";
    default  "default-src 'self'; script-src 'self' __SPA_SCRIPT_HASHES__; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $stn_is_api $stn_nosniff {
    1        "";
    default  "nosniff";
}
map $stn_is_api $stn_frame_options {
    1        "";
    default  "DENY";
}
map $stn_is_api $stn_referrer_policy {
    1        "";
    default  "strict-origin-when-cross-origin";
}
map $stn_is_api $stn_permissions_policy {
    1        "";
    default  "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
}
map $stn_is_api $stn_coop {
    1        "";
    default  "same-origin";
}
# Hashed Vite assets never change → cache forever; everything else (index.html, SPA routes) must
# be revalidated so a deployment is picked up immediately.
map $uri $stn_cache_control {
    ~^/api/     "";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}
# Keep the scheme of an outer TLS proxy; fall back to this hop's scheme.
map $http_x_forwarded_proto $stn_forwarded_proto {
    ""       $scheme;
    default  $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # add_header is only used at server level (location-level add_header would drop these);
    # empty values (API paths) are not sent.
    add_header Content-Security-Policy $stn_csp always;
    add_header X-Content-Type-Options $stn_nosniff always;
    add_header X-Frame-Options $stn_frame_options always;
    add_header Referrer-Policy $stn_referrer_policy always;
    add_header Permissions-Policy $stn_permissions_policy always;
    add_header Cross-Origin-Opener-Policy $stn_coop always;
    add_header Cache-Control $stn_cache_control;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Resolve the backend at request time so a restarted backend container (new IP) is found.
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $stn_backend http://${BACKEND_UPSTREAM};

    # --- API (web panel + SCP:SL plugins) -----------------------------------------------
    # proxy_pass without a URI part forwards the request line exactly as sent. This matters:
    # plugin requests are Ed25519-signed over the path *including the query string* and the raw
    # body, so nothing here may rewrite, normalise or re-encode either.
    location /api/ {
        proxy_pass $stn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stn_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Stream evidence uploads/downloads instead of spooling them to disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Liveness of this container (the backend's /healthz and /readyz are not exposed publicly).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- static files -----------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # SPA fallback: unknown paths render index.html and the client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
