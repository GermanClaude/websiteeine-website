<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daneben – NULLPUNKT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0D">
<meta name="color-scheme" content="dark">
<!-- GitHub Pages liefert diese Seite für jede fehlende Adresse aus, auch in Unterordnern: Darum ist sie
     in sich geschlossen (keine relativen Dateien); der Rückweg wird aus der Adresse bestimmt. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0B0D'/%3E%3Crect x='11' y='11' width='10' height='10' rx='1.5' fill='%23FF5B1F'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --black: #0A0B0D; --ink: #E9E6DF; --ink-2: #B9B5AC; --signal: #FF5B1F; --line: #2A2D33; --g: clamp(16px, 4vw, 64px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--black); color: var(--ink); }
  body {
    min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; gap: 24px;
    padding: max(var(--g), env(safe-area-inset-top)) max(var(--g), env(safe-area-inset-right)) max(var(--g), env(safe-area-inset-bottom)) max(var(--g), env(safe-area-inset-left));
    font-family: "Archivo NP", "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono NP", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: .02em; color: var(--ink); text-decoration: none; }
  .o { color: var(--signal); }
  main { align-self: end; }
  h1 { margin: 0; font-size: clamp(56px, 17vw, 280px); line-height: .82; font-weight: 800; font-stretch: 62%; letter-spacing: -.01em; overflow-wrap: anywhere; }
  p { margin: 24px 0 0; font-size: clamp(20px, 2vw, 28px); line-height: 1.3; max-width: 34ch; }
  a.back { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; color: var(--ink); font-weight: 700; font-size: clamp(20px, 2vw, 28px); text-decoration: underline 1px #5A5E66; text-underline-offset: .15em; }
  a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  footer { border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<header><a class="brand" href="./" data-root>NULLPUNKT.</a></header>
<main>
  <p class="mono">Fehler 404 · Seite nicht gefunden</p>
  <h1>DANEBEN<span class="o">.</span></h1>
  <p>Diese Adresse trifft nichts. Zurück zum Nullpunkt und neu einschießen.</p>
  <a class="back" href="./" data-root>Zum Nullpunkt<span class="o">.</span></a>
</main>
<footer class="mono">Ziel. Atmen. Punkt.</footer>
<script>
  // Projektseiten auf GitHub Pages liegen unter /<repository>/; sonst ist die Wurzel der Rückweg.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var root = /\.github\.io$/i.test(location.hostname) && seg ? '/' + seg + '/' : '/';
    var links = document.querySelectorAll('[data-root]');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', root);
    // Hausschriften nachladen (Pfade in fonts.css sind relativ zur CSS-Datei)
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = root + 'assets/css/fonts.css';
    document.head.appendChild(css);
  })();
</script>
</body>
</html>
